<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Plataforma</title>

  <!-- Firebase (desde CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    /* (mismo CSS que antes) */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #f5f7fa 0%, #e9ecf2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .login-card {
      background: #ffffff;
      max-width: 400px;
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 8px 16px rgba(0,0,0,0.06);
      transition: transform 0.2s ease;
    }
    .login-card:hover { transform: translateY(-4px); }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-header h1 { font-size: 1.8rem; font-weight: 600; color: #1a2634; }
    .login-header p { color: #6b7a8a; font-size: 0.95rem; margin-top: 0.3rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-weight: 500; font-size: 0.9rem; color: #2c3e50; margin-bottom: 0.4rem; }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #dce1e8;
      border-radius: 12px;
      background: #fafbfc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #4a6cf7;
      box-shadow: 0 0 0 3px rgba(74,108,247,0.15);
      background: #ffffff;
    }
    .btn-login {
      width: 100%;
      padding: 0.8rem;
      background: #4a6cf7;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
    }
    .btn-login:hover { background: #3a5bd9; box-shadow: 0 8px 16px rgba(74,108,247,0.25); }
    .btn-login:active { transform: scale(0.97); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-message {
      background: #fee8e8;
      color: #b33636;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-top: 1rem;
      display: none;
      border-left: 4px solid #b33636;
    }
    .error-message.show { display: block; }
    .login-footer { text-align: center; margin-top: 1.8rem; font-size: 0.85rem; color: #8a9aa8; }
    .login-footer span {
      display: inline-block;
      background: #f0f2f5;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-weight: 500;
      color: #4a6cf7;
    }
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) { .login-card { padding: 2rem 1.5rem; } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>RepU Acceso</h1>
      <p>Inicia sesión con tu cuenta</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">Iniciar sesión</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div id="errorMessage" class="error-message"></div>
    <div class="login-footer"><span>Panel de administración</span></div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
